<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#1b1a17">
<meta name="description" content="采配 ―戦国立体合戦録― 織田信長の時代を舞台にした、ブラウザーで遊べる3D戦国タクティクス。桶狭間・川中島・姉川・三方ヶ原・長篠の史実5合戦と天下統一。">
<title>采配 ―戦国立体合戦録―</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%231b1a17'/%3E%3Ctext x='32' y='46' font-size='40' text-anchor='middle' fill='%23c9a64b' font-family='serif'%3E%E9%87%87%3C/text%3E%3C/svg%3E">
</head>
<body>
<div id="app"><div id="stage"></div><div id="ui"></div></div>
<noscript>このゲームを遊ぶにはJavaScriptを有効にしてください。</noscript>
<script>/* 采配 v1.0.0 */(()=>{var qc=`:root {
  color-scheme: dark;
  --ink: #1b1a17; --ink2: #2a2722; --paper: #efe6d2; --paper2: #e3d7bd; --shu: #b7282e; --gold: #c9a64b; --ai: #2b4a6f;
  --txt: #f3ead5; --dim: #b9ae96; --line: rgba(201,166,75,0.35);
  --serif: "Yu Mincho","YuMincho","Hiragino Mincho ProN","Noto Serif JP","MS PMincho",serif;
  --sans: "Hiragino Kaku Gothic ProN","Yu Gothic UI","Yu Gothic","Meiryo",system-ui,sans-serif;
  --safe-b: env(safe-area-inset-bottom, 0px);
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--ink); color: var(--txt); font-family: var(--sans); overflow: hidden; -webkit-text-size-adjust: 100%; }
#app { position: fixed; inset: 0; }
#stage { position: absolute; inset: 0; }
#stage.hidden { visibility: hidden; }
#ui { position: absolute; inset: 0; pointer-events: none; }
#ui > * { pointer-events: auto; }
.hidden { display: none !important; }
button { font: inherit; color: var(--txt); background: linear-gradient(#3a342b, #25211b); border: 1px solid var(--line); border-radius: 8px; padding: 8px 12px; cursor: pointer; touch-action: manipulation; }
button:hover:not(:disabled) { border-color: var(--gold); }
button:disabled { opacity: 0.45; cursor: default; }
button.primary { background: linear-gradient(#b7282e, #7e1a1f); border-color: #e0a34b; color: #fff; }
button.danger { background: linear-gradient(#6b1a1a, #3d0f0f); }
body.touch button { min-height: 44px; }
a { color: #e8c35a; }
.small { font-size: 12px; } .dim { color: var(--dim); } .red { color: #ff6a5a; } .org { color: #ffb347; }
.row { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; margin-top: 10px; }
.chip { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 6px; vertical-align: middle; border: 1px solid rgba(0,0,0,0.4); }

/* ---------- \u753B\u9762 ---------- */
.screen { position: absolute; inset: 0; overflow-y: auto; background: radial-gradient(ellipse at 50% 0%, #3a3226 0%, #1b1a17 70%); -webkit-overflow-scrolling: touch; }
.page { max-width: 1080px; margin: 0 auto; padding: 16px 16px calc(40px + var(--safe-b)); }
.page-h { display: flex; align-items: center; gap: 12px; position: sticky; top: 0; background: rgba(27,26,23,0.92); padding: 8px 0; z-index: 2; backdrop-filter: blur(4px); }
.page-h h2 { margin: 0; font-family: var(--serif); font-size: 22px; letter-spacing: 0.1em; }
.lead { color: var(--dim); }
.panel { background: rgba(40,36,30,0.85); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; margin: 10px 0; }
.panel h3 { margin: 0 0 8px; font-family: var(--serif); }
h3, h4 { font-family: var(--serif); }

/* \u30BF\u30A4\u30C8\u30EB */
.title-screen { background: linear-gradient(180deg, #d9c9a3 0%, #b89b6a 45%, #5a4630 75%, #1b1a17 100%); }
.title { position: relative; min-height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 24px 16px calc(24px + var(--safe-b)); overflow: hidden; }
.title-mt { position: absolute; left: 0; right: 0; bottom: 0; width: 100%; height: 45%; }
.title-sun { position: absolute; top: 9%; right: 14%; width: 120px; height: 120px; border-radius: 50%; background: radial-gradient(circle, #c8352e 0%, #a52a24 60%, rgba(165,42,36,0) 72%); opacity: 0.9; }
.title-box { position: relative; text-align: center; color: var(--ink); }
.title-sub { font-family: var(--serif); letter-spacing: 0.6em; font-size: 16px; }
.title-main { font-family: var(--serif); font-size: clamp(88px, 22vw, 168px); margin: 0; line-height: 1; letter-spacing: 0.08em; text-shadow: 3px 3px 0 rgba(255,255,255,0.25); }
.title-seal { position: absolute; right: -58px; top: 34px; background: var(--shu); color: #fbe9d7; font-family: var(--serif); font-size: 15px; line-height: 1.15; padding: 6px 7px; border-radius: 4px; transform: rotate(6deg); box-shadow: 0 2px 6px rgba(0,0,0,0.3); }
.title-copy { font-family: var(--serif); font-size: 17px; margin: 6px 0 22px; }
.title-menu { position: relative; display: flex; flex-direction: column; gap: 10px; width: min(420px, 100%); }
.title-menu .big { font-family: var(--serif); font-size: 22px; padding: 12px; display: flex; flex-direction: column; align-items: center; background: linear-gradient(rgba(35,30,24,0.92), rgba(20,18,15,0.95)); }
.title-menu .big small { font-family: var(--sans); font-size: 12px; color: var(--dim); margin-top: 2px; }
.title-menu .row button { flex: 1; background: rgba(27,26,23,0.85); }
.title-note { position: relative; font-size: 11px; color: #d8cdb4; margin-top: 18px; text-align: center; max-width: 520px; }

/* \u5408\u6226\u9332 */
.scards { display: grid; gap: 12px; }
.scard { display: flex; background: rgba(40,36,30,0.9); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
.s-year { writing-mode: vertical-rl; font-family: var(--serif); font-size: 22px; background: var(--shu); color: #fff; padding: 12px 8px; letter-spacing: 0.1em; }
.s-body { padding: 10px 14px; flex: 1; }
.s-body h3 { margin: 0; font-size: 20px; }
.s-date { color: var(--dim); font-size: 12px; margin: 2px 0 6px; }
.s-hist { margin: 0 0 8px; font-size: 13px; }
.s-sides { display: flex; gap: 8px; flex-wrap: wrap; }
.side-btn { display: flex; align-items: center; gap: 4px; }
.stars { color: #e8c35a; margin-left: 8px; letter-spacing: 1px; }
.brief-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
@media (max-width: 760px) { .brief-grid { grid-template-columns: 1fr; } }
.brief dl { display: grid; grid-template-columns: auto 1fr; gap: 4px 10px; margin: 0 0 8px; }
.brief dt { color: var(--dim); }
.goal { color: #ffd88a; font-weight: bold; }
.cols { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.ulist { list-style: none; padding: 0; margin: 0; font-size: 13px; }
.ulist li { padding: 3px 0; border-bottom: 1px dashed rgba(255,255,255,0.08); }
.ulist em { color: #e8c35a; font-style: normal; margin-left: 4px; font-size: 11px; }
.ulist .dim { display: block; font-size: 11px; }
.src { font-size: 12px; color: var(--dim); }
.brief-go { text-align: center; margin: 16px 0; }
.brief-go .big { font-family: var(--serif); font-size: 24px; padding: 12px 60px; letter-spacing: 0.4em; }

/* \u540D\u9451 */
.tabs { display: flex; gap: 6px; margin: 8px 0; flex-wrap: wrap; }
.tabs .on { background: var(--shu); }
.gcards { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 8px; }
.gcard { background: rgba(40,36,30,0.85); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; }
.g-h b { font-family: var(--serif); font-size: 17px; }
.g-life { float: right; color: var(--dim); font-size: 12px; }
.g-st { font-size: 12px; color: #e8dcc0; margin: 4px 0; }
.g-note { font-size: 13px; }
.srclist li { margin: 4px 0; }
.help table, .tbl { border-collapse: collapse; margin: 6px 0; font-size: 13px; }
.tbl th, .tbl td { border: 1px solid rgba(255,255,255,0.15); padding: 4px 8px; text-align: center; }
.tbl td.good { color: #7dff9a; font-weight: bold; } .tbl td.bad { color: #ff8a7a; }
.modal .tbl { font-size: 12px; }
.settings label { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin: 8px 0; }
select { font: inherit; background: #2a2722; color: var(--txt); border: 1px solid var(--line); border-radius: 6px; padding: 6px; }

/* \u30E2\u30FC\u30C0\u30EB */
.modal-back { position: fixed; inset: 0; background: rgba(0,0,0,0.55); display: flex; align-items: center; justify-content: center; z-index: 50; padding: 16px; }
.modal { background: #2a2620; border: 1px solid var(--gold); border-radius: 12px; padding: 16px; max-width: 640px; width: 100%; max-height: 86vh; overflow-y: auto; color: var(--txt); box-shadow: 0 10px 40px rgba(0,0,0,0.6); }
.modal.small { max-width: 380px; text-align: center; }
.modal h2, .modal h3 { margin-top: 0; font-family: var(--serif); }
.modal-close { text-align: right; margin-top: 10px; }
.menu-list { display: flex; flex-direction: column; gap: 8px; }
.logbox { font-size: 13px; line-height: 1.6; max-height: 50vh; overflow-y: auto; }

/* ---------- \u5408\u6226HUD ---------- */
#ui > .hud { position: absolute; inset: 0; pointer-events: none; font-size: 13px; }
.hud > * { pointer-events: auto; }
.hud .banner, .hud .aibar { pointer-events: none; }
.topbar { position: absolute; top: 0; left: 0; right: 0; display: flex; align-items: center; gap: 10px; padding: 6px 10px; padding-top: max(6px, env(safe-area-inset-top)); background: linear-gradient(rgba(20,18,15,0.9), rgba(20,18,15,0.6)); border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.tb-name { font-family: var(--serif); font-size: 16px; font-weight: bold; }
.tb-turn { color: #ffd88a; }
.tb-weather { color: #bfe0ff; }
.tb-btn { padding: 4px 10px; }
.topbar .tb-btn:first-of-type { margin-left: auto; }
.card, .card2 { position: absolute; left: 8px; top: 52px; width: 280px; background: rgba(28,25,21,0.93); border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; }
.card2 { top: auto; bottom: 110px; border-color: rgba(255,120,90,0.5); }
.card.enemy { border-color: rgba(255,120,90,0.6); }
.c-head { display: flex; gap: 8px; align-items: center; }
.c-flag { width: 34px; height: 44px; display: flex; align-items: center; justify-content: center; font-family: var(--serif); font-size: 22px; font-weight: bold; border-radius: 3px; flex: none; }
.c-name { font-family: var(--serif); font-size: 17px; font-weight: bold; }
.c-sub { font-size: 11px; color: var(--dim); }
.tag { display: inline-block; font-size: 10px; background: #4a443a; border-radius: 4px; padding: 0 4px; margin-left: 3px; color: #fff; }
.tag.gold { background: #8a6d1d; } .tag.warn { background: #7a2a55; }
.c-bar { display: flex; align-items: center; gap: 6px; margin-top: 4px; }
.c-bar span { width: 26px; font-size: 11px; color: var(--dim); }
.c-bar .bar { flex: 1; height: 8px; background: #3a3530; border-radius: 4px; overflow: hidden; }
.c-bar .bar i { display: block; height: 100%; }
.c-bar b { width: 40px; text-align: right; }
.c-stats { display: flex; flex-wrap: wrap; gap: 2px 10px; font-size: 11px; color: var(--dim); margin-top: 4px; }
.c-stats b { color: var(--txt); }
.c-skill { margin-top: 4px; font-size: 12px; }
.c-skill em { font-style: normal; color: #ffb3a0; margin-left: 6px; } .c-skill em.ok { color: #9dff9a; }
.c-desc { font-size: 11px; color: var(--dim); }
.c-ter { font-size: 11px; color: var(--dim); margin-top: 3px; }
.preview { position: absolute; right: 8px; top: 52px; width: 290px; background: rgba(28,25,21,0.95); border: 1px solid #e0a34b; border-radius: 10px; padding: 10px; }
.pv-h { font-family: var(--serif); font-weight: bold; margin-bottom: 4px; }
.pv-desc { font-size: 12px; color: var(--dim); margin-bottom: 4px; }
.pv-row b.red { font-size: 18px; }
.pv-mods { font-size: 11px; color: #ffd88a; margin: 2px 0 4px; }
.pv-btns { display: flex; gap: 8px; margin-top: 8px; }
.pv-btns button { flex: 1; }
.actions { position: absolute; left: 50%; transform: translateX(-50%); bottom: calc(64px + var(--safe-b)); display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; max-width: 96vw; }
.actions button { background: rgba(40,35,28,0.95); font-size: 14px; padding: 8px 14px; }
.actions button.primary { background: linear-gradient(#b7282e, #7e1a1f); }
.cam { position: absolute; right: 8px; bottom: calc(64px + var(--safe-b)); display: grid; grid-template-columns: repeat(3, 40px); gap: 4px; }
.cam button { padding: 4px; font-size: 16px; background: rgba(28,25,21,0.85); height: 38px; }
.turnbar { position: absolute; left: 0; right: 0; bottom: 0; display: flex; gap: 8px; justify-content: center; padding: 8px; padding-bottom: calc(8px + var(--safe-b)); background: linear-gradient(rgba(20,18,15,0), rgba(20,18,15,0.85)); pointer-events: none; }
.turnbar button { pointer-events: auto; min-width: 120px; font-size: 15px; }
.btn-end { background: linear-gradient(#5a4520, #3a2c14); border-color: var(--gold); }
.btn-end.pulse { animation: pulse 1.2s infinite; background: linear-gradient(#b7282e, #7e1a1f); }
@keyframes pulse { 0%,100% { box-shadow: 0 0 0 0 rgba(232,195,90,0.7); } 50% { box-shadow: 0 0 0 8px rgba(232,195,90,0); } }
.aibar { position: absolute; left: 50%; bottom: calc(14px + var(--safe-b)); transform: translateX(-50%); background: rgba(120,20,20,0.85); padding: 6px 18px; border-radius: 20px; font-family: var(--serif); }
.banner { position: absolute; left: 0; right: 0; top: 38%; text-align: center; background: linear-gradient(90deg, rgba(0,0,0,0), rgba(15,12,10,0.85) 20%, rgba(15,12,10,0.85) 80%, rgba(0,0,0,0)); padding: 12px 0; animation: bannerIn 0.35s ease-out; }
.bn-main { font-family: var(--serif); font-size: 34px; font-weight: bold; letter-spacing: 0.2em; color: #fff; text-shadow: 0 2px 8px #000; }
.bn-sub { font-family: var(--serif); font-size: 16px; color: #ffd88a; }
@keyframes bannerIn { from { transform: scaleY(0.2); opacity: 0; } to { transform: scaleY(1); opacity: 1; } }
.logpanel { position: absolute; right: 8px; top: 52px; width: 320px; max-height: 50vh; background: rgba(20,18,15,0.95); border: 1px solid var(--line); border-radius: 10px; display: flex; flex-direction: column; z-index: 5; }
.log-h { display: flex; justify-content: space-between; align-items: center; padding: 6px 10px; font-family: var(--serif); border-bottom: 1px solid var(--line); }
.log-body { overflow-y: auto; padding: 6px 10px; font-size: 12px; line-height: 1.6; }
.dirpad { position: absolute; inset: 0; pointer-events: none; }
.dirpad .dir { position: absolute; pointer-events: auto; width: 46px; height: 46px; border-radius: 50%; background: rgba(183,40,46,0.9); border: 2px solid #ffd88a; font-size: 20px; padding: 0; display: flex; align-items: center; justify-content: center; }
.toast { position: absolute; left: 50%; top: 58px; transform: translateX(-50%); background: rgba(20,18,15,0.92); border: 1px solid var(--gold); padding: 6px 14px; border-radius: 16px; font-size: 13px; pointer-events: none; animation: bannerIn 0.25s; white-space: nowrap; max-width: 94vw; overflow: hidden; text-overflow: ellipsis; }
.result-over { position: absolute; inset: 0; background: rgba(0,0,0,0.6); display: flex; align-items: center; justify-content: center; padding: 16px; z-index: 20; }
.result { background: #2a2620; border: 2px solid var(--gold); border-radius: 14px; padding: 16px; width: min(640px, 100%); max-height: 92vh; overflow-y: auto; text-align: center; }
.r-big { font-family: var(--serif); font-size: 52px; font-weight: bold; letter-spacing: 0.3em; }
.result.win .r-big { color: #ffd24a; } .result.lose .r-big { color: #9fb0c4; }
.r-stars { font-size: 30px; color: #e8c35a; letter-spacing: 4px; }
.r-table { overflow-x: auto; margin: 10px 0; }
.r-table table { width: 100%; border-collapse: collapse; font-size: 12px; }
.r-table th, .r-table td { border-bottom: 1px solid rgba(255,255,255,0.1); padding: 4px; text-align: left; }
.r-table tr.mine td { background: rgba(201,166,75,0.08); }

/* ---------- \u5929\u4E0B\u7D71\u4E00 ---------- */
.camp { display: flex; flex-direction: column; background: #1b1a17; overflow: hidden; }
.c-top { display: flex; align-items: center; gap: 10px; padding: 6px 10px; padding-top: max(6px, env(safe-area-inset-top)); background: rgba(20,18,15,0.95); border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.c-top .c-flag { width: 30px; height: 38px; font-size: 18px; }
.c-info { display: flex; flex-direction: column; font-family: var(--serif); }
.c-info b { font-size: 16px; }
.c-res { display: flex; gap: 12px; font-size: 13px; flex-wrap: wrap; }
.c-res small { color: var(--dim); }
.c-logbtn { margin-left: auto; }
.c-main { flex: 1; display: flex; min-height: 0; }
.c-map { flex: 1; min-width: 0; display: flex; background: radial-gradient(ellipse at 50% 50%, #2c4a5e 0%, #16242e 80%); }
.jmap { width: 100%; height: 100%; }
.jmap .land { fill: #6d6146; stroke: #a8966a; stroke-width: 2; opacity: 0.55; }
.jmap .adj { stroke: rgba(255,240,200,0.35); stroke-width: 3; }
.jmap .order { stroke: #ff5a3a; stroke-width: 6; stroke-dasharray: 10 6; }
.jmap .node { cursor: pointer; }
.jmap .hit { fill: transparent; }
.jmap .disc { stroke: rgba(0,0,0,0.6); stroke-width: 2; }
.jmap .node.mine .disc { stroke: #ffd88a; stroke-width: 4; }
.jmap .node.sel .disc { stroke: #fff; stroke-width: 6; }
.jmap .node.tgt .disc { stroke: #ff4a3a; stroke-width: 6; animation: tgt 1s infinite; }
@keyframes tgt { 50% { stroke-opacity: 0.3; } }
.jmap .castle { fill: #f2eee4; stroke: #333; }
.jmap .pn { font-family: var(--serif); font-size: 17px; font-weight: bold; text-anchor: middle; pointer-events: none; }
.jmap .pt { font-size: 11px; text-anchor: middle; pointer-events: none; }
.c-side { width: 340px; overflow-y: auto; padding: 0 8px; background: rgba(20,18,15,0.9); border-left: 1px solid var(--line); }
.c-bottom { display: flex; align-items: center; gap: 10px; justify-content: flex-end; padding: 8px 10px; padding-bottom: calc(8px + var(--safe-b)); background: rgba(20,18,15,0.95); border-top: 1px solid var(--line); }
.c-bottom .hint { margin-right: auto; color: var(--dim); font-size: 13px; }
.p-h { display: flex; align-items: center; gap: 6px; }
.p-h h3 { margin: 0; }
.p-h .x { margin-left: auto; padding: 2px 10px; }
.p-stats { display: flex; gap: 12px; flex-wrap: wrap; margin: 6px 0; font-size: 13px; }
.genlist { list-style: none; padding: 0; margin: 0; }
.genlist li { padding: 5px 0; border-bottom: 1px dashed rgba(255,255,255,0.08); display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
.genlist li .dim { font-size: 11px; width: 100%; }
.genlist li.busy { opacity: 0.6; }
.genlist li button { padding: 2px 8px; margin-left: auto; font-size: 12px; min-height: 0; }
.genlist input { width: 20px; height: 20px; }
.cmds { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin: 10px 0; }
.pick { background: rgba(183,40,46,0.15); border: 1px solid rgba(183,40,46,0.5); border-radius: 8px; padding: 8px; margin: 8px 0; }
.rank { list-style: none; padding: 0; margin: 0; }
.rank li { display: flex; align-items: center; padding: 3px 0; }
.rank li b { margin-left: auto; }
.rank li.me { color: #ffd88a; }
.orders { padding-left: 16px; font-size: 12px; }
.orders button { padding: 0 6px; font-size: 11px; min-height: 0; }
.clan-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }
.clan-btn { display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 10px; }
.clan-btn .c-flag { width: 40px; height: 52px; font-size: 26px; }
.clan-btn b { font-family: var(--serif); font-size: 17px; }
.clan-btn small { color: var(--dim); font-size: 11px; }

/* ---------- \u30B9\u30DE\u30DB ---------- */
@media (orientation: portrait), (max-width: 700px) {
  .topbar { font-size: 12px; gap: 6px; }
  .tb-name { font-size: 14px; width: 100%; }
  .card { top: auto; bottom: calc(166px + var(--safe-b)); left: 6px; right: 6px; width: auto; padding: 6px 8px; }
  .card .c-desc, .card .c-ter { display: none; }
  .card .c-bar { margin-top: 2px; }
  .actions { width: 96vw; }
  .actions button { padding: 6px 10px; font-size: 13px; }
  .card2 { display: none !important; }
  .preview { top: auto; bottom: calc(112px + var(--safe-b)); left: 6px; right: 6px; width: auto; z-index: 3; }
  .preview ~ .actions { display: none; }
  .hud:has(.preview:not(.hidden)) .card { display: none; }
  .toast { top: 150px; left: 8px; right: 104px; transform: none; white-space: normal; text-align: center; max-width: none; }
